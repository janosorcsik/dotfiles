"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[directory]
format = '[$path]($style)[$read_only]($read_only_style)'
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = ' [$branch]($style)'
truncation_length = 20

[git_status]
format = '[$all_status]($style)[ $ahead_behind]($style)'
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
untracked  = "?${count}"
modified   = "!${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "×${count}"
stashed    = "~${count}"
ignore_submodules = true

[cmd_duration]
min_time = 5_000
format = ' [$duration]($style)'